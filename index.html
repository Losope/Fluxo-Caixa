<script>
/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDbL7l41Ff-TiYbeKJVFyA66hk5mP7BeZc",
  authDomain: "fluxo-caixa-dbc59.firebaseapp.com",
  projectId: "fluxo-caixa-dbc59",
  storageBucket: "fluxo-caixa-dbc59.firebasestorage.app",
  messagingSenderId: "780323890144",
  appId: "1:780323890144:web:9466ab247618d7ca9ac185",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try {
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
} catch (e) {}

/* ---------- Leitura de PDF (extração de texto no navegador) ---------- */
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
async function extractTextFromPdf(arrayBuffer) {
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const allLines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.filter((it) => it.str !== undefined);
    const hasEOLInfo = items.some((it) => typeof it.hasEOL === "boolean");

    if (hasEOLInfo) {
      // Segue as quebras de linha reais detectadas pelo próprio pdf.js — mais fiel ao
      // layout original do que agrupar por posição, especialmente em documentos com colunas.
      let curLine = "";
      for (const it of items) {
        curLine += it.str;
        if (it.hasEOL) {
          if (curLine.trim()) allLines.push(curLine.trim());
          curLine = "";
        } else if (it.str && !/\s$/.test(it.str)) {
          curLine += " ";
        }
      }
      if (curLine.trim()) allLines.push(curLine.trim());
    } else {
      // Fallback: agrupa por posição Y aproximada quando o documento não informa hasEOL.
      const posItems = items.map((it) => ({ str: it.str, x: it.transform[4], y: Math.round(it.transform[5]) }));
      posItems.sort((a, b) => (b.y - a.y) || (a.x - b.x));
      let curY = null, curLine = [];
      for (const it of posItems) {
        if (curY === null || Math.abs(it.y - curY) > 3) {
          if (curLine.length) allLines.push(curLine.map((c) => c.str).join(" ").trim());
          curLine = [it];
          curY = it.y;
        } else {
          curLine.push(it);
        }
      }
      if (curLine.length) allLines.push(curLine.map((c) => c.str).join(" ").trim());
    }
    allLines.push("");
  }
  return allLines.join("\n");
}

// Tenta achar o valor total declarado na própria fatura, pra conferir contra a soma dos
// lançamentos importados (procura na linha do rótulo e nas 2 seguintes, pois em muitos
// layouts o valor fica numa caixa separada, em outra linha).
function detectInvoiceTotal(raw) {
  const lines = (raw || "").split(/\r?\n/);
  const keywordRe = /total\s+desta\s+fatura|o\s+total\s+da\s+sua\s+fatura|valor\s+total\s+da\s+fatura|total\s+a\s+pagar/i;
  for (let i = 0; i < lines.length; i++) {
    if (keywordRe.test(lines[i])) {
      for (let j = i; j <= Math.min(i + 2, lines.length - 1); j++) {
        const m = lines[j].match(/(\d{1,3}(?:\.\d{3})*,\d{2})/);
        if (m) return parseAmountBR(m[1]);
      }
    }
  }
  return null;
}

const TX_COLLECTION = () => db.collection("households").doc("main").collection("transactions");
const SETTINGS_DOC = () => db.collection("households").doc("main").collection("meta").doc("settings");
const LOANS_COLLECTION = () => db.collection("households").doc("main").collection("loans");
const LOAN_ENTRIES_COLLECTION = () => db.collection("households").doc("main").collection("loanEntries");

let authUser = null;
let unsubTx = null;
let unsubSettings = null;
let unsubLoans = null;
let unsubLoanEntries = null;
let dataReady = false;
let syncing = false;
let syncError = "";

/* ---------- Estado (agora é apenas um cache local dos dados do Firestore) ---------- */
let state = { transactions: [], loans: [], loanEntries: [], settings: { closingDay: null, marginDays: 5, meuNome: "", esposaNome: "", customCategoriesDespesa: [], customCategoriesReceita: [] } };

function attachListeners() {
  dataReady = false;
  unsubTx = TX_COLLECTION().onSnapshot(
    (snap) => {
      state.transactions = snap.docs.map((d) => d.data());
      dataReady = true;
      render();
    },
    (err) => { syncError = `transações: ${err.code || err.message}`; console.error("Erro ao sincronizar lançamentos:", err); render(); }
  );
  unsubSettings = SETTINGS_DOC().onSnapshot(
    (doc) => {
      if (doc.exists) state.settings = doc.data();
      render();
    },
    (err) => { syncError = `configurações: ${err.code || err.message}`; console.error("Erro ao sincronizar configurações:", err); render(); }
  );
  unsubLoans = LOANS_COLLECTION().onSnapshot(
    (snap) => {
      state.loans = snap.docs.map((d) => d.data());
      render();
    },
    (err) => { syncError = `empréstimos: ${err.code || err.message}`; console.error("Erro ao sincronizar empréstimos:", err); render(); }
  );
  unsubLoanEntries = LOAN_ENTRIES_COLLECTION().onSnapshot(
    (snap) => {
      state.loanEntries = snap.docs.map((d) => d.data());
      render();
    },
    (err) => { syncError = `valores de empréstimo: ${err.code || err.message}`; console.error("Erro ao sincronizar lançamentos de empréstimo:", err); render(); }
  );
}
function detachListeners() {
  if (unsubTx) unsubTx();
  if (unsubSettings) unsubSettings();
  if (unsubLoans) unsubLoans();
  if (unsubLoanEntries) unsubLoanEntries();
  unsubTx = null; unsubSettings = null; unsubLoans = null; unsubLoanEntries = null;
}

auth.onAuthStateChanged((user) => {
  authUser = user;
  if (user) {
    attachListeners();
  } else {
    detachListeners();
    state = { transactions: [], loans: [], loanEntries: [], settings: { closingDay: null, marginDays: 5, meuNome: "", esposaNome: "", customCategoriesDespesa: [], customCategoriesReceita: [] } };
  }
  render();
});

async function doLogin(email, password) {
  loginError = "";
  loginLoading = true;
  render();
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    loginError = translateAuthError(e.code);
  }
  loginLoading = false;
  render();
}
function doLogout() {
  auth.signOut();
}
function translateAuthError(code) {
  if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "E-mail ou senha incorretos.";
  if (code === "auth/user-not-found") return "Não encontrei esse e-mail cadastrado.";
  if (code === "auth/invalid-email") return "E-mail inválido.";
  if (code === "auth/too-many-requests") return "Muitas tentativas. Aguarde um pouco e tente de novo.";
  return "Não consegui entrar. Verifique os dados e tente novamente.";
}
let loginEmail = "", loginPassword = "", loginError = "", loginLoading = false;

async function withSync(fn) {
  syncing = true;
  render();
  try {
    await fn();
  } catch (e) {
    console.error(e);
    alert("Não consegui salvar na nuvem agora. Verifique sua internet e tente de novo.");
  }

  const custom = type === "receita" ? state.settings.customCategoriesReceita : state.settings.customCategoriesDespesa;
  const extra = (custom || []).filter((c) => !base.includes(c));

// Monta a grade de um mês pro calendário de seleção múltipla: null = dia de preenchimento (fora do mês)
function getCalendarGrid(yearMonth) {
  const [y, m] = yearMonth.split("-").map(Number);
  const firstWeekday = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  return cells;
}

function formatBRL(value) {
  return (value || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function todayISO() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function addMonthsISO(dateStr, n) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, m - 1 + n, d);
  const yy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}
function faturaAnchorDate(dateStr, closingDay, marginDays) {
  if (!closingDay) return dateStr;
  const [y, m, d] = dateStr.split("-").map(Number);
  const purchaseDate = new Date(y, m - 1, d);
  const closingDate = new Date(y, m - 1, closingDay);
  const cutoff = new Date(closingDate);
  cutoff.setDate(cutoff.getDate() - (marginDays || 0));
  return purchaseDate > cutoff ? addMonthsISO(dateStr, 1) : dateStr;
}
function parseAmountBR(val) {
  if (val === undefined || val === null) return null;
  if (typeof val === "number") return val;
  let s = String(val).trim();
  if (!s) return null;
  s = s.replace(/r\$/i, "").trim();
  const negative = /^-/.test(s) || /^\(.*\)$/.test(s);
  s = s.replace(/[()]/g, "").replace(/^-/, "").trim();
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  const num = parseFloat(s);
  if (isNaN(num)) return null;
  return negative ? -num : num;
}
function parseDateFlexible(val) {
  if (!val) return null;
  const s = String(val).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = "20" + y;
    return `${y}-${mo.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }
  return null;
}
// Parser simples de CSV/texto colado (sem depender de bibliotecas externas)
function splitCSVLine(line) {
  const delim = line.includes(";") && !line.includes(",") ? ";" : ",";
  const parts = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuotes = !inQuotes; continue; }
    if (c === delim && !inQuotes) { parts.push(cur); cur = ""; continue; }
    cur += c;
  }
  parts.push(cur);
  return parts.map((p) => p.trim());
}
function parseGenericFaturaText(raw, refMonth) {
  const lines = (raw || "").trim().split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return [];
  let startIdx = 0;
  const firstCols = splitCSVLine(lines[0]).map((c) => c.toLowerCase());
  const looksLikeHeader = firstCols.some((c) => /data|date|descri|histor|valor|amount/.test(c));
  let dateIdx = 0, descIdx = 1, amountIdx = 2;
  if (looksLikeHeader) {
    startIdx = 1;
    const dIdx = firstCols.findIndex((c) => /data|date/.test(c));
    const dsIdx = firstCols.findIndex((c) => /descri|histor|lan[çc]amento|estabelecimento|title/.test(c));
    const aIdx = firstCols.findIndex((c) => /valor|amount|value/.test(c));
    if (dIdx >= 0) dateIdx = dIdx;
    if (dsIdx >= 0) descIdx = dsIdx;
    if (aIdx >= 0) amountIdx = aIdx;
  }
  const rows = [];
  for (let i = startIdx; i < lines.length; i++) {
    let cols = splitCSVLine(lines[i]);
    // Se o delimitador for vírgula, "234,50" pode ter sido quebrado em duas colunas ("234","50").
    // Remonta o valor decimal quando isso acontece.
    if (cols.length >= 2) {
      const last = cols[cols.length - 1];
      const prev = cols[cols.length - 2];
      if (/^\d{2}$/.test(last) && /^-?\d{1,3}(\.\d{3})*$/.test(prev)) {
        cols = cols.slice(0, -2).concat(`${prev},${last}`);
      }
    }
    let raw_date, raw_desc, raw_amount;
    if (cols.length >= 3) {
      raw_date = cols[dateIdx]; raw_desc = cols[descIdx]; raw_amount = cols[amountIdx];
    } else if (cols.length === 2) {
      raw_date = ""; raw_desc = cols[0]; raw_amount = cols[1];
    } else continue;
    const amount = parseAmountBR(raw_amount);
    const parsedISO = parseDateFlexible(raw_date);
    const day = parsedISO ? parsedISO.slice(8, 10) : "01";
    const desc = (raw_desc || "").toString().trim();
    if (amount === null || amount === 0 || !desc) continue;
    rows.push({
      id: `imp-${Date.now()}-${i}`,
      parsedDate: `${refMonth}-${day}`,
      description: desc,
      amount,
      holder: null,
      include: amount > 0,
      classification: "so_eu",
      splitEu: "50",
    });
  }
  return rows;
}

// Reconhece faturas com seções por titular (ex.: Santander, cartões adicionais):
// "NOME TITULAR - XXXX XXXX XXXX 0000" seguido de blocos "Despesas"/"Parcelamentos"
// com linhas "DD/MM Descrição [Parcela DD/DD] Valor".
function normalizeName(s) {
  return (s || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toUpperCase()
    .replace(/[^A-Z\s]/g, "")
    .trim();
}
// Compara nomes tolerando abreviações no meio (ex.: "LEONARDO C SANTOS" vs "LEONARDO COSTA DOS SANTOS"):
// exige que o primeiro e o último nome batam, já que o do meio costuma vir abreviado nas faturas.
function namesMatch(configured, holder) {
  const a = normalizeName(configured).split(/\s+/).filter(Boolean);
  const b = normalizeName(holder).split(/\s+/).filter(Boolean);
  if (!a.length || !b.length) return false;
  if (a.length === 1 || b.length === 1) {
    const as = a.join(""), bs = b.join("");
    return as.includes(bs) || bs.includes(as);
  }
  return a[0] === b[0] && a[a.length - 1] === b[b.length - 1];
}
function parseHolderTxLine(line, isParcelamento) {
  let s = line.trim();
  const valueMatch = s.match(/(-?\d{1,3}(?:\.\d{3})*,\d{2})\s*$/);
  if (!valueMatch) return null;
  const amountStr = valueMatch[1];
  s = s.slice(0, valueMatch.index).trim();
  if (!s) return null;

  if (isParcelamento) {
    const pm = s.match(/\d{1,2}\/\d{1,2}\s*$/);
    if (pm) s = s.slice(0, pm.index).trim();
  }
  if (!s) return null;

  let day = null;
  const dm = s.match(/^(\d{1,2})\/(\d{1,2})\s+(.*)$/);
  let desc;
  if (dm) {
    day = dm[1].padStart(2, "0");
    desc = dm[3].trim();
  } else {
    desc = s.trim();
  }
  // remove marcador solto de 1 dígito no início (ícone de tipo de compra mal copiado do PDF)
  desc = desc.replace(/^[0-9]\s+(?=[A-ZÀ-Ü0-9*])/, "").trim();
  if (!desc || /^valor total$/i.test(desc)) return null;

  // Sinal de linhas mescladas indevidamente (colunas diferentes juntadas numa só):
  // outro valor monetário embutido no meio da descrição, ou texto longo demais pra um
  // item de fatura real.
  if (/\d{1,3}(?:\.\d{3})*,\d{2}/.test(desc)) return null;
  if (desc.length > 70) return null;

  const amount = parseAmountBR(amountStr);
  if (amount === null || amount <= 0) return null;
  return { day, desc, amount };
}
function parseHolderFaturaText(raw, refMonth) {
  const rawLines = (raw || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const cardMaskHeaderRe = /^@?\s*([A-ZÀ-Ü][A-ZÀ-Ü\s.]{2,40}?)\s*-\s*[\dX]{3,4}\s*XXXX\s*XXXX\s*[\dX]{3,4}/i;
  const bareNameRe = /^[A-ZÀ-Ü][A-ZÀ-Ü.]*(?:\s[A-ZÀ-Ü.]+){1,5}$/;
  const txLineRe = /^\d{1,2}\/\d{1,2}\s+.+\d{1,3}(?:\.\d{3})*,\d{2}\s*$/;
  const sectionRe = /^(Pagamento e Demais Cr[ée]ditos|Parcelamentos|Despesas)\s*$/i;
  const colHeaderRe = /^(Compra\s+Data\s+Descri|DATA\s+ESTABELECIMENTO|DATA\s+VALOR)/i;
  const totalOrSummaryRe = /^VALOR TOTAL/i;
  const summaryKeywordRe = /\b(total|lançamentos|limite|encargo|encargos|juros|iof|cet|financiado|solicitado|dispon[íi]vel|utilizado)\b/i;

  let currentHolder = null;
  let currentSection = null;
  let foundAnyHolder = false;
  const rows = [];
  let idx = 0;

  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];

    const hm = line.match(cardMaskHeaderRe);
    if (hm) {
      currentHolder = hm[1].trim();
      currentSection = null;
      foundAnyHolder = true;
      continue;
    }

    // Faturas sem máscara de cartão explícita (ex.: Itaú): nome do titular isolado numa linha,
    // seguido (após um eventual cabeçalho de coluna) por uma linha que parece um lançamento real.
    if (bareNameRe.test(line) && line.replace(/[.\s]/g, "").length >= 6) {
      let lookaheadOk = false;
      for (let j = i + 1; j <= Math.min(i + 2, rawLines.length - 1); j++) {
        if (colHeaderRe.test(rawLines[j])) continue;
        lookaheadOk = txLineRe.test(rawLines[j]);
        break;
      }
      if (lookaheadOk) {
        currentHolder = line;
        currentSection = "despesas";
        foundAnyHolder = true;
        continue;
      }
    }

    const sm = line.match(sectionRe);
    if (sm) {
      currentSection = sm[1].toLowerCase();
      continue;
    }
    if (colHeaderRe.test(line) || totalOrSummaryRe.test(line)) continue;
    if (!/^\d{1,2}\/\d{1,2}\s/.test(line) && summaryKeywordRe.test(line)) continue;
    if (!currentSection) continue;
    if (currentSection.startsWith("pagamento")) continue; // pagamentos/créditos, não são gasto
    if (!currentSection.startsWith("despesa") && !currentSection.startsWith("parcelamento")) continue;

    const parsed = parseHolderTxLine(line, currentSection.startsWith("parcelamento"));
    if (!parsed) continue;
    const day = parsed.day || "01";
    idx++;
    rows.push({
      id: `imp-${Date.now()}-${idx}`,
      parsedDate: `${refMonth}-${day}`,
      description: parsed.desc,
      amount: parsed.amount,
      holder: currentHolder,
      include: true,
      classification: "so_eu",
      splitEu: "50",
    });
  }

  return foundAnyHolder ? rows : null;
}
function parseFaturaText(raw, refMonth, meuNome, esposaNome) {
  const holderRows = parseHolderFaturaText(raw, refMonth);
  if (holderRows && holderRows.length) {
    return holderRows.map((r) => {
      let classification = "so_eu";
      if (esposaNome && r.holder && namesMatch(esposaNome, r.holder)) {
        classification = "so_esposa";
      } else if (meuNome && r.holder && namesMatch(meuNome, r.holder)) {
        classification = "so_eu";
      }
      return { ...r, classification };
    });
  }
  return parseGenericFaturaText(raw, refMonth);
}
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }

/* ---------- Empréstimos (ex.: dinheiro emprestado, abatido aos poucos por serviço, com fechamento + acerto manual) ---------- */
function computeLoanEntries(loanId, status) {
  return state.loanEntries
    .filter((e) => e.loanId === loanId && (!status || e.status === status))
    .sort((a, b) => (a.date < b.date ? 1 : -1));
}
function computeLoanPendingTotal(loanId) {
  return state.loanEntries.filter((e) => e.loanId === loanId && e.status === "pending").reduce((s, e) => s + e.amount, 0);
}
// Agrupa as corridas já fechadas por fechamento (mesmo closingId = mesma parcela resolvida).
// Cada fechamento guarda o próprio delta (sobra/excesso), calculado na hora do fechamento.
function computeLoanClosings(loanId) {
  const closed = state.loanEntries.filter((e) => e.loanId === loanId && e.status === "closed");
  const groups = {};
  for (const e of closed) {
    if (!groups[e.closingId]) groups[e.closingId] = { closingId: e.closingId, date: e.closingDate, delta: e.closingDelta, entries: [] };
    groups[e.closingId].entries.push(e);
  }
  return Object.values(groups).sort((a, b) => (a.date < b.date ? 1 : -1));
}
// Nº de parcelas já fechadas — derivado do histórico, nunca um contador guardado à parte.
function computeLoanInstallmentsResolved(loanId) {
  return computeLoanClosings(loanId).length;
}
// Saldo devedor do empréstimo: cai uma parcela inteira por fechamento (não o valor das corridas).
function computeLoanBalance(loanId) {
  const loan = state.loans.find((l) => l.id === loanId);
  if (!loan) return 0;
  return loan.initialAmount - computeLoanInstallmentsResolved(loanId) * loan.installmentAmount;
}
// Saldo do ACERTO: soma de tudo que já foi fechado (sobra/excesso) mas ainda NÃO foi lançado no
// fluxo de caixa, menos o que já foi de fato acertado (lançamentos de acerto já registrados).
// Positivo = a seu favor (ele ainda te deve, vira entrada quando acertar).
// Negativo = contra você (você passou a dever, vira saída quando acertar).
function computeLoanSaldoAcerto(loanId) {
  const loan = state.loans.find((l) => l.id === loanId);
  if (!loan) return 0;
  const fromClosings = computeLoanClosings(loanId).reduce((s, c) => s + c.delta, 0);
  const settlementTxs = state.transactions.filter((t) => t.category === `Empréstimo: ${loan.name}` && !t.isSettlement);
  const fromSettlements = settlementTxs.reduce((s, t) => s + (t.type === "receita" ? -t.amount : t.amount), 0);
  return fromClosings + fromSettlements;
}
// Quanto já deveria ter sido fechado até hoje, seguindo o cronograma (parcela x nº de parcelas).
function computeLoanScheduleInfo(loan) {
  if (!loan.installmentAmount || !loan.totalInstallments) return null;
  const start = new Date(loan.startDate + "T00:00:00");
  const today = new Date();
  let months = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth()) + 1;
  months = Math.max(0, Math.min(loan.totalInstallments, months));
  const resolved = computeLoanInstallmentsResolved(loan.id);
  return { months, resolved, aoDia: resolved >= months };
}
// Calcula o resultado de um fechamento SEM aplicar nada ainda — usado pra mostrar a prévia na tela.
function computeClosingPreview(loan, ridesTotal) {
  const diff = loan.installmentAmount - ridesTotal; // positivo = faltou (soma no saldo a seu favor); negativo = passou (contra você)
  return { delta: diff, isZero: Math.abs(diff) < 0.005 };
}

function addTransaction() {
  const f = ui.form;
  const amountNum = parseFloat(String(f.amount).replace(",", "."));
  if (!f.description.trim() || isNaN(amountNum) || amountNum <= 0) return;
  const isCartao = f.type === "despesa" && f.paymentMethod === "cartao";
  const shared = f.type === "despesa" && f.shared;
  const splitEu = shared ? Math.max(0, Math.min(100, parseFloat(f.splitEu) || 0)) : null;

  if (ui.editingId) {
    // Edição: atualiza só este lançamento (não mexe em outras parcelas do mesmo grupo).
    const updated = {
      date: f.date,
      description: f.description.trim(),
      category: f.category,
      type: f.type,
      amount: amountNum,
      paymentMethod: f.type === "despesa" ? f.paymentMethod : null,
      shared, paidBy: shared ? f.paidBy : null, splitEu: shared ? splitEu : null,
    };
    const id = ui.editingId;
    withSync(async () => {
      await TX_COLLECTION().doc(id).update(updated);
    });
    ui.modal = null;
    ui.editingId = null;
    render();
    return;
  }

  const totalParcelas = isCartao ? Math.max(1, Math.min(24, parseInt(f.installments, 10) || 1)) : 1;
  const anchorDate = isCartao ? faturaAnchorDate(f.date, state.settings.closingDay, state.settings.marginDays) : f.date;
  const groupId = uid();
  const entries = [];
  for (let i = 0; i < totalParcelas; i++) {
    entries.push({
      id: `${groupId}-${i}`,
      date: addMonthsISO(anchorDate, i),
      description: totalParcelas > 1 ? `${f.description.trim()} (${i + 1}/${totalParcelas})` : f.description.trim(),
      category: f.category, type: f.type, amount: amountNum / totalParcelas,
      paymentMethod: f.type === "despesa" ? f.paymentMethod : null,
      shared, paidBy: shared ? f.paidBy : null, splitEu: shared ? splitEu : null,
    });
  }
  withSync(async () => {
    const batch = db.batch();
    entries.forEach((e) => batch.set(TX_COLLECTION().doc(e.id), e));
    await batch.commit();
  });
  ui.modal = null;
  render();
}

function closeInstallment() {
  const loan = state.loans.find((l) => l.id === ui.selectedLoanId);

  const entries = state.loanEntries.filter((e) => ui.selectedPendingIds.includes(e.id));

  const delta = loan.installmentAmount - ridesTotal;

  const closingDate = todayISO();
  withSync(async () => {
    const batch = db.batch();
    entries.forEach((e) => batch.update(LOAN_ENTRIES_COLLECTION().doc(e.id), { status: "closed", closingId, closingDate, closingDelta: delta }));

  });

function importBackupFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    let parsed;
    try {
      parsed = JSON.parse(ev.target.result);
      if (!Array.isArray(parsed.transactions)) throw new Error("formato inválido");
    } catch (err) {
      alert("Não consegui ler esse arquivo de backup.");
      return;
    }
    if (!confirm(`Isso vai enviar ${parsed.transactions.length} lançamento(s) para a nuvem, somados aos que já existem. Continuar?`)) return;
    withSync(async () => {
      const chunks = [];
      for (let i = 0; i < parsed.transactions.length; i += 400) chunks.push(parsed.transactions.slice(i, i + 400));
      for (const chunk of chunks) {
        const batch = db.batch();
        chunk.forEach((t) => batch.set(TX_COLLECTION().doc(t.id || uid()), t));
        await batch.commit();
      }
      if (parsed.settings) await SETTINGS_DOC().set(parsed.settings);
    });
    ui.modal = null;
    render();
    alert("Backup restaurado com sucesso!");
  };
  reader.readAsText(file, "utf-8");
}

/* ---------- Cálculos ---------- */
function computeMonthTx(month) {
  return state.transactions.filter((t) => t.date.slice(0, 7) === month).sort((a, b) => (a.date < b.date ? 1 : -1));
}
function computeTotals(monthTx) {
  const receitas = monthTx.filter((t) => t.type === "receita").reduce((s, t) => s + t.amount, 0);
  const despesas = monthTx.filter((t) => t.type === "despesa").reduce((s, t) => s + t.amount, 0);
  const cartao = monthTx.filter((t) => t.type === "despesa" && t.paymentMethod === "cartao").reduce((s, t) => s + t.amount, 0);
  return { receitas, despesas, saldo: receitas - despesas, cartao };
}
function computeSaldoGeral(monthTx) {
  return monthTx.reduce((s, t) => s + (t.type === "receita" ? t.amount : -t.amount), 0);
}
function computeSaldoEsposa(monthTx) {
  let balance = 0;
  for (const t of monthTx) {
    if (t.isSettlement) balance += t.settlementDirection === "paguei" ? t.amount : -t.amount;
    else if (t.shared && t.type === "despesa") {
      const eu = t.splitEu ?? 50, dela = 100 - eu;
      if (t.paidBy === "eu") balance += (t.amount * dela) / 100;
      else balance -= (t.amount * eu) / 100;
    }
  }
  return balance;
}
// Lista, item a item, tudo que compõe o saldo com a esposa no mês selecionado (contas divididas
// + acertos feitos naquele mês), do mais recente pro mais antigo, com a contribuição de cada um.
function computeDebtBreakdown(monthTx) {
  const items = [];
  for (const t of monthTx) {
    if (t.isSettlement) {
      const contribution = t.settlementDirection === "paguei" ? t.amount : -t.amount;
      items.push({ tx: t, contribution, kind: "settlement" });
    } else if (t.shared && t.type === "despesa") {
      const eu = t.splitEu ?? 50, dela = 100 - eu;
      const contribution = t.paidBy === "eu" ? (t.amount * dela) / 100 : -((t.amount * eu) / 100);
      items.push({ tx: t, contribution, kind: "shared" });
    }
  }
  return items.sort((a, b) => (a.tx.date < b.tx.date ? 1 : -1));
}
function computeRunningMap(monthTx) {
  const asc = [...monthTx].sort((a, b) => (a.date > b.date ? 1 : -1));
  let running = 0; const map = {};
  for (const t of asc) { running += t.type === "receita" ? t.amount : -t.amount; map[t.id] = running; }
  return map;
}
function computeAvailableMonths() {
  const set = new Set(state.transactions.map((t) => t.date.slice(0, 7)));
  set.add(todayISO().slice(0, 7));
  return [...set].sort().reverse();
}
// Compara entradas/saídas/saldo dos últimos N meses com dados (mais antigo primeiro).
function computeMonthlyTrend(count) {
  const months = computeAvailableMonths().slice(0, count).reverse();
  return months.map((mo) => {
    const t = computeTotals(computeMonthTx(mo));
    return { month: mo, receitas: t.receitas, despesas: t.despesas, saldo: t.saldo };
  });
}
function computeProjecaoCartao() {
  const currentMonth = todayISO().slice(0, 7);
  const byMonth = {};
  for (const t of state.transactions) {
    if (t.type === "despesa" && t.paymentMethod === "cartao") {
      const mo = t.date.slice(0, 7);
      if (mo >= currentMonth) byMonth[mo] = (byMonth[mo] || 0) + t.amount;
    }
  }
  return Object.entries(byMonth).sort(([a], [b]) => (a < b ? -1 : 1)).slice(0, 6);
}
// Soma as despesas do mês por categoria (ignora acertos com a esposa, que não são gasto de fato),
// ordenado do maior pro menor, já com o percentual sobre o total.
function computeCategoryBreakdown(monthTx) {
  const byCat = {};
  let total = 0;
  for (const t of monthTx) {
    if (t.type !== "despesa" || t.isSettlement) continue;
    byCat[t.category] = (byCat[t.category] || 0) + t.amount;
    total += t.amount;
  }
  const budgets = state.settings.budgets || {};
  const rows = Object.entries(byCat)
    .map(([category, amount]) => {
      const budget = budgets[category] || null;
      return {
        category, amount,
        pct: total > 0 ? (amount / total) * 100 : 0,
        budget,
        budgetPct: budget ? (amount / budget) * 100 : null,
      };
    })
    .sort((a, b) => b.amount - a.amount);
  const overBudget = rows.filter((r) => r.budget && r.amount > r.budget);
  return { rows, total, overBudget };
}
// Quantos dias faltam até o próximo vencimento da fatura (dia fixo do mês), ou null se não configurado.
function computeDaysUntilDue(dueDay) {
  if (!dueDay) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let due = new Date(today.getFullYear(), today.getMonth(), dueDay);
  if (due < today) due = new Date(today.getFullYear(), today.getMonth() + 1, dueDay);
  return Math.round((due - today) / 86400000);
}

/* ---------- Render ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/"/g, "&quot;"); }
// Escapa texto que vai virar argumento de string JS dentro de atributos onclick/onchange
// (ex.: onclick="fn('${escJs(nome)}')") — evita quebrar o JS se o texto tiver aspas simples,
// barra invertida ou quebra de linha.
function escJs(s) {
  return String(s == null ? "" : s)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "");
}

function captureUIState() {
  const active = document.activeElement;
  const focusKey = active && active.getAttribute ? active.getAttribute("data-focus") : null;
  const hasSelection = active && typeof active.selectionStart === "number";
  const sel = hasSelection ? [active.selectionStart, active.selectionEnd] : null;
  const modal = document.querySelector(".modal, .modal-large");
  const modalScroll = modal ? modal.scrollTop : null;
  const importList = document.querySelector(".import-list");
  const importListScroll = importList ? importList.scrollTop : null;
  const bodyScroll = window.scrollY;
  return { focusKey, sel, modalScroll, importListScroll, bodyScroll };
}
function restoreUIState(snap) {
  if (snap.focusKey) {
    const el = document.querySelector(`[data-focus="${snap.focusKey}"]`);
    if (el) {
      el.focus({ preventScroll: true });
      if (snap.sel && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(snap.sel[0], snap.sel[1]); } catch (e) {}
      }
    }
  }
  const modal = document.querySelector(".modal, .modal-large");
  if (modal && snap.modalScroll != null) modal.scrollTop = snap.modalScroll;
  const importList = document.querySelector(".import-list");
  if (importList && snap.importListScroll != null) importList.scrollTop = snap.importListScroll;
  if (!snap.focusKey) window.scrollTo(0, snap.bodyScroll);
}

function render() {
  const snap = captureUIState();
  renderInner();
  restoreUIState(snap);
}

                <button class="icon-btn" onclick="${t.isSettlement ? `openEditSettle('${t.id}')` : `openEditForm('${t.id}')`}" aria-label="Editar">${ICONS.edit}</button>
                <button class="icon-btn" onclick="if(confirm('Excluir este lançamento?'))deleteTransaction('${t.id}')" aria-label="Excluir">${ICONS.trash}</button>
              </div>` : ""}
          </div>`).join("");
        })()}
      </div>
    </div>

    <button class="fab" onclick="openForm()">${ICONS.plus}</button>

    ${ui.modal === "form" ? renderFormModal() : ""}
    ${ui.modal === "settle" ? renderSettleModal(saldoEsposa) : ""}
    ${ui.modal === "settings" ? renderSettingsModal() : ""}
    ${ui.modal === "import" ? renderImportModal() : ""}
    ${ui.modal === "debtDetail" ? renderDebtDetailModal(saldoEsposa, monthTx) : ""}
    ${ui.modal === "categoryDetail" ? renderCategoryDetailModal(monthTx, monthLabel) : ""}
    ${ui.modal === "loans" ? renderLoansModal() : ""}
  `;
  document.getElementById("app").innerHTML = html;
}

function renderFormModal() {
  const f = ui.form;
  const isDespesa = f.type === "despesa";
  const cats = categoriesFor(f.type);
  let hint = "";
  if (isDespesa && f.paymentMethod === "cartao") {
    const anchor = faturaAnchorDate(f.date, state.settings.closingDay, state.settings.marginDays);
    const am = anchor.slice(5, 7);
    const label = MONTHS_PT[parseInt(am, 10) - 1];
    const shifted = anchor !== f.date;
    const n = parseInt(f.installments, 10) || 1;
    const amountNum = parseFloat(String(f.amount).replace(",", ".")) || 0;
    const parcelaTxt = n > 1 && f.amount ? `${n}x de ${formatBRL(amountNum / n)}` : "1 parcela";
    hint = `${parcelaTxt} · 1ª na fatura de ${label}${shifted ? " (dentro da margem/após o fechamento)" : ""}`;
  }
  return `
    <div class="modal-overlay" onclick="ui.modal=null;ui.editingId=null;render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h2 class="modal-title">${ui.editingId ? "Editar lançamento" : "Novo lançamento"}</h2><button class="icon-btn" onclick="ui.modal=null;ui.editingId=null;render()">${ICONS.x}</button></div>

        <div class="type-toggle">
          <button class="type-btn ${f.type === "despesa" ? "active-despesa" : ""}" onclick="setFormType('despesa')">Saída</button>
          <button class="type-btn ${f.type === "receita" ? "active-receita" : ""}" onclick="setFormType('receita')">Entrada</button>
        </div>

        <label class="field">Descrição
          <input data-focus="form-description" value="${esc(f.description)}" oninput="ui.form.description=this.value" placeholder="Ex.: Supermercado, salário, aluguel..." />
        </label>

        <div class="row2">
          <label class="field">Valor${ui.editingId && f.description.match(/\(\d+\/\d+\)$/) ? " desta parcela" : " total"} (R$)
            <input data-focus="form-amount" value="${esc(f.amount)}" oninput="ui.form.amount=this.value;render()" placeholder="0,00" inputmode="decimal" />
          </label>
          <label class="field">Data
            <input type="date" value="${f.date}" onchange="ui.form.date=this.value;render()" />
          </label>
        </div>

        <label class="field">Categoria
          <select onchange="ui.form.category=this.value">
            ${cats.map((c) => `<option value="${c}" ${f.category === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </label>

        ${isDespesa ? `
          <div class="divider"></div>
          <label class="field">Forma de pagamento
            <div class="type-toggle">
              <button class="type-btn ${f.paymentMethod === "dinheiro" ? "active-neutral" : ""}" onclick="ui.form.paymentMethod='dinheiro';ui.form.installments='1';render()">Dinheiro / Débito</button>
              <button class="type-btn ${f.paymentMethod === "cartao" ? "active-neutral" : ""}" onclick="ui.form.paymentMethod='cartao';render()">Cartão de crédito</button>
            </div>
          </label>

          ${f.paymentMethod === "cartao" && !ui.editingId ? `
            <label class="field">Número de parcelas
              <input data-focus="form-installments" type="number" min="1" max="24" value="${f.installments}" oninput="ui.form.installments=this.value;render()" />
              <span class="hint">${hint}</span>
            </label>` : ""}
          ${f.paymentMethod === "cartao" && ui.editingId ? `<span class="hint">A edição altera só este lançamento — as outras parcelas do grupo (se houver) não são afetadas.</span>` : ""}

          <label class="checkbox-row">
            <input type="checkbox" ${f.shared ? "checked" : ""} onchange="ui.form.shared=this.checked;render()" /> Conta dividida com a esposa
          </label>

          ${f.shared ? `
            <label class="field">Quem pagou
              <div class="type-toggle">
                <button class="type-btn ${f.paidBy === "eu" ? "active-neutral" : ""}" onclick="ui.form.paidBy='eu';render()">Você</button>
                <button class="type-btn ${f.paidBy === "esposa" ? "active-neutral" : ""}" onclick="ui.form.paidBy='esposa';render()">Esposa</button>
              </div>
            </label>
            <label class="field">Sua parte (%) — o restante fica com a esposa
              <input data-focus="form-spliteu" type="number" min="0" max="100" value="${f.splitEu}" oninput="ui.form.splitEu=this.value" />
            </label>` : ""}
        ` : ""}

        <button class="submit-btn" onclick="addTransaction()">${ui.editingId ? "Salvar alterações" : "Registrar lançamento"}</button>
      </div>
    </div>`;
}

function renderLoansModal() {
  if (ui.loansStep === "loanForm") return renderLoanFormModal();
  if (ui.loansStep === "detail") return renderLoanDetailModal();
  if (ui.loansStep === "entryForm") return renderLoanEntryFormModal();
  if (ui.loansStep === "settleForm") return renderLoanSettleFormModal();
  return renderLoansListModal();
}

function renderLoansListModal() {
  return `
    <div class="modal-overlay" onclick="closeLoans()">
      <div class="modal-large" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">Lançamentos</h2>
          <button class="icon-btn" onclick="closeLoans()">${ICONS.x}</button>
        </div>
        <div class="hint" style="opacity:0.6;font-size:10px">[debug: ${state.loans.length} empréstimo(s) · ${state.loanEntries.length} valor(es) no total]</div>
        ${state.loans.length === 0 ? `<div class="hint">Nenhum lançamento cadastrado ainda.</div>` : `
          <div class="import-list">
            ${state.loans.map((loan) => {
              const saldo = computeLoanBalance(loan.id);
              const pendente = computeLoanPendingTotal(loan.id);
              const saldoAcerto = computeLoanSaldoAcerto(loan.id);
              return `
                <div class="import-row" style="cursor:pointer" onclick="openLoanDetail('${loan.id}')">
                  <div class="import-row-top">
                    <div>
                      <div style="font-weight:500;font-size:14px">${esc(loan.name)}</div>
                      <div class="hint">Emprestado: ${formatBRL(loan.initialAmount)} · ${loan.totalInstallments}x de ${formatBRL(loan.installmentAmount)}${pendente > 0 ? ` · ${formatBRL(pendente)} pendente` : ""}${Math.abs(saldoAcerto) > 0.004 ? ` · acerto: ${formatBRL(Math.abs(saldoAcerto))} ${saldoAcerto > 0 ? "a seu favor" : "contra você"}` : ""}</div>
                    </div>
                    <span class="import-amount" style="color:${saldo > 0 ? "#D97D80" : "#7FBE9E"}">${saldo > 0 ? formatBRL(saldo) : "Quitado"}</span>
                  </div>
                </div>`;
            }).join("")}
          </div>`}
        <button class="submit-btn" onclick="openNewLoanForm()">+ Novo lançamento</button>
      </div>
    </div>`;
}

function renderLoanFormModal() {
  const f = ui.loanForm;
  const installmentAmount = parseFloat(String(f.installmentAmount).replace(",", "."));
  const totalInstallments = parseInt(f.totalInstallments, 10);
  const computedTotal = installmentAmount > 0 && totalInstallments > 0 ? installmentAmount * totalInstallments : null;
  return `
    <div class="modal-overlay" onclick="ui.loansStep='list';render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">${ui.editingLoanId ? "Editar lançamento" : "Novo lançamento"}</h2>
          <button class="icon-btn" onclick="ui.loansStep='list';render()">${ICONS.x}</button>
        </div>
        <label class="field">Nome (quem deve / do que se trata)
          <input data-focus="loan-name" value="${esc(f.name)}" oninput="ui.loanForm.name=this.value" placeholder="Ex.: Empréstimo ao tio" />
        </label>

        <div class="row2">
          <label class="field">Valor da parcela mensal (R$)
            <input data-focus="loan-installmentamount" value="${esc(f.installmentAmount)}" oninput="ui.loanForm.installmentAmount=this.value;render()" placeholder="Ex.: 384,00" inputmode="decimal" />
          </label>
          <label class="field">Nº de parcelas
            <input data-focus="loan-totalinstallments" type="number" min="1" value="${esc(f.totalInstallments)}" oninput="ui.loanForm.totalInstallments=this.value;render()" placeholder="Ex.: 24" />
          </label>
        </div>
        ${computedTotal != null ? `<span class="hint">Valor total do empréstimo: ${formatBRL(computedTotal)}</span>` : ""}
        <span class="hint">Cada fechamento de valores resolve uma parcela inteira: se os valores ficarem abaixo da parcela, a diferença vira entrada no seu fluxo de caixa; se passarem, o excedente vira saída.</span>
        ${ui.loanFormError ? `<div class="error-text">${esc(ui.loanFormError)}</div>` : ""}

        <label class="field">Data da 1ª parcela / início do empréstimo
          <input type="date" value="${f.startDate}" onchange="ui.loanForm.startDate=this.value" />
        </label>
        <button class="submit-btn" onclick="saveLoan()">${ui.editingLoanId ? "Salvar alterações" : "Cadastrar lançamento"}</button>
      </div>
    </div>`;
}

function renderLoanDetailModal() {
  const loan = state.loans.find((l) => l.id === ui.selectedLoanId);
  if (!loan) return "";
  const pending = computeLoanEntries(loan.id, "pending");
  const saldo = computeLoanBalance(loan.id);
  const resolvido = loan.initialAmount - saldo;
  const pct = loan.initialAmount > 0 ? Math.min(100, (resolvido / loan.initialAmount) * 100) : 0;
  const schedule = computeLoanScheduleInfo(loan);
  const installmentsResolved = computeLoanInstallmentsResolved(loan.id);
  const saldoAcerto = computeLoanSaldoAcerto(loan.id);
  const selectedEntries = pending.filter((e) => ui.selectedPendingIds.includes(e.id));
  const selectedTotal = selectedEntries.reduce((s, e) => s + e.amount, 0);
  const preview = computeClosingPreview(loan, selectedTotal);
  const closings = computeLoanClosings(loan.id);
  const settlements = state.transactions
    .filter((t) => t.category === `Empréstimo: ${loan.name}`)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  return `
    <div class="modal-overlay" onclick="closeLoans()">
      <div class="modal-large" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">${esc(loan.name)}</h2>
          <div style="display:flex;gap:4px">
            <button class="icon-btn" onclick="openEditLoanForm('${loan.id}')" aria-label="Editar lançamento">${ICONS.edit}</button>
            <button class="icon-btn" onclick="deleteLoan('${loan.id}')" aria-label="Excluir lançamento">${ICONS.trash}</button>
            <button class="icon-btn" onclick="closeLoans()">${ICONS.x}</button>
          </div>
        </div>

        <div class="balance-hint">
          Saldo devedor do empréstimo: <strong style="color:${saldo > 0 ? "#D97D80" : "#7FBE9E"}">${saldo > 0 ? formatBRL(saldo) : "Quitado"}</strong>
          <br />Parcelas fechadas: ${installmentsResolved} de ${loan.totalInstallments} (${formatBRL(loan.installmentAmount)}/parcela)
          ${schedule ? `<br />Previsto até agora: ${schedule.months} parcela(s) — ${schedule.aoDia ? `<span style="color:#7FBE9E">em dia</span>` : `<span style="color:#D97D80">atrasado</span>`}` : ""}
        </div>
        <div style="background:#1B2B23;border-radius:4px;height:7px;overflow:hidden">
          <div style="background:#2E7D5B;height:100%;width:${Math.max(2, pct)}%"></div>
        </div>

        <div class="balance-hint" style="border-color:#C9A227">
          Saldo de acerto pendente: <strong style="color:${saldoAcerto === 0 ? "#A8A296" : saldoAcerto > 0 ? "#7FBE9E" : "#D97D80"}">
            ${saldoAcerto === 0 ? "Zerado" : `${saldoAcerto > 0 ? "a seu favor" : "contra você"}: ${formatBRL(Math.abs(saldoAcerto))}`}
          </strong>
          <br /><span class="hint" style="margin:0">Isso ainda NÃO está no seu fluxo de caixa — só entra quando você registrar o acerto abaixo.</span>
        </div>
        ${Math.abs(saldoAcerto) > 0.004 ? `<button class="settle-link" onclick="openLoanSettle('${loan.id}')">${ICONS.hand} Registrar acerto realizado</button>` : ""}

        <div class="divider"></div>
        <button class="submit-btn" onclick="openNewLoanEntryForm('${loan.id}')">+ Registrar valor(es)</button>

        <div class="hint" style="text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;margin-top:10px">Pendente — marque os valores pra fechar uma parcela</div>
        ${pending.length === 0 ? `<div class="hint">Nenhum valor pendente. Você ainda pode fechar a parcela sem marcar nada (parcela cheia soma no saldo de acerto).<br /><span style="opacity:0.6;font-size:10px">[debug: este empréstimo id=${loan.id} · total de valores no banco (todos os empréstimos)=${state.loanEntries.length} · valores deste empréstimo=${state.loanEntries.filter(e=>e.loanId===loan.id).length}]</span></div>` : `
          <div class="import-list">
            ${pending.map((e) => `
              <div class="import-row">
                <div class="import-row-top">
                  <label class="checkbox-row" style="flex:1">
                    <input type="checkbox" ${ui.selectedPendingIds.includes(e.id) ? "checked" : ""} onchange="toggleSelectPendingEntry('${e.id}')" />
                    <div>
                      <div style="font-weight:500;font-size:13px">${esc(e.description)}</div>
                      <div class="hint">${e.date.slice(8,10)}/${e.date.slice(5,7)}/${e.date.slice(0,4)}</div>
                    </div>
                  </label>
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                    <span class="import-amount" style="color:#C9A227">${formatBRL(e.amount)}</span>
                    <button class="icon-btn" onclick="openEditLoanEntryForm('${e.id}')" aria-label="Editar">${ICONS.edit}</button>
                    <button class="icon-btn" onclick="deleteLoanEntry('${e.id}')" aria-label="Excluir">${ICONS.trash}</button>
                  </div>
                </div>
              </div>`).join("")}
          </div>`}

        <div class="balance-hint" style="margin-top:10px">
          Valores marcados: <strong>${formatBRL(selectedTotal)}</strong> · Parcela: <strong>${formatBRL(loan.installmentAmount)}</strong>
          ${preview.isZero
            ? `<br /><span style="color:#7FBE9E">Bateu certinho — só fecha a parcela, sem mudar o saldo de acerto.</span>`
            : `<br />Vai somar ao saldo de acerto: <strong style="color:${preview.delta > 0 ? "#7FBE9E" : "#D97D80"}">${preview.delta > 0 ? "+" : ""}${formatBRL(preview.delta)} ${preview.delta > 0 ? "a seu favor" : "contra você"}</strong> (ainda não vai pro fluxo de caixa)`}
          ${selectedEntries.length === 0 ? `<br /><span class="hint" style="margin:0">Não marcou nenhum valor? Sem problema — fechar assim já soma a parcela cheia (${formatBRL(loan.installmentAmount)}) no saldo de acerto.</span>` : ""}
        </div>
        <button class="submit-btn" onclick="closeInstallment()">Fechar esta parcela</button>

        <div class="divider"></div>
        <div class="hint" style="text-transform:uppercase;letter-spacing:.06em;font-size:10.5px">Histórico de parcelas fechadas</div>
        ${closings.length === 0 ? `<div class="hint">Nenhuma parcela fechada ainda.</div>` : `
          <div class="import-list">
            ${closings.map((c) => `
              <div class="import-row">
                <div class="import-row-top">
                  <div>
                    <div style="font-weight:500;font-size:13px">Fechamento de ${c.date.slice(8,10)}/${c.date.slice(5,7)}/${c.date.slice(0,4)}</div>
                    <div class="hint">Valores incluídos: ${formatBRL(c.entries.reduce((s,x)=>s+x.amount,0))} (${c.entries.length})</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                    <span class="import-amount" style="color:${c.delta === 0 ? "#A8A296" : c.delta > 0 ? "#7FBE9E" : "#D97D80"}">${c.delta === 0 ? "bateu certinho" : `${c.delta > 0 ? "+" : ""}${formatBRL(c.delta)}`}</span>
                    <button class="icon-btn" onclick="deleteLoanClosing('${c.closingId}')" aria-label="Desfazer fechamento">${ICONS.trash}</button>
                  </div>
                </div>
              </div>`).join("")}
          </div>`}

        <div class="divider"></div>
        <div class="hint" style="text-transform:uppercase;letter-spacing:.06em;font-size:10.5px">Acertos realizados (já no fluxo de caixa)</div>
        ${settlements.length === 0 ? `<div class="hint">Nenhum acerto registrado ainda.</div>` : `
          <div class="import-list">
            ${settlements.map((t) => `
              <div class="import-row">
                <div class="import-row-top">
                  <div>
                    <div style="font-weight:500;font-size:13px">${esc(t.description)}</div>
                    <div class="hint">${t.date.slice(8,10)}/${t.date.slice(5,7)}/${t.date.slice(0,4)}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                    <span class="import-amount" style="color:${t.type === "receita" ? "#7FBE9E" : "#D97D80"}">${t.type === "receita" ? "+" : "−"} ${formatBRL(t.amount)}</span>
                    <button class="icon-btn" onclick="openEditForm('${t.id}')" aria-label="Editar">${ICONS.edit}</button>
                    <button class="icon-btn" onclick="if(confirm('Excluir este acerto?'))deleteTransaction('${t.id}')" aria-label="Excluir">${ICONS.trash}</button>
                  </div>
                </div>
              </div>`).join("")}
          </div>`}
      </div>
    </div>`;
}

function renderLoanSettleFormModal() {
  const loan = state.loans.find((l) => l.id === ui.selectedLoanId);
  if (!loan) return "";
  const saldoAcerto = computeLoanSaldoAcerto(loan.id);
  const f = ui.loanSettleForm;
  return `
    <div class="modal-overlay" onclick="ui.loansStep='detail';render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">Acerto — ${esc(loan.name)}</h2>
          <button class="icon-btn" onclick="ui.loansStep='detail';render()">${ICONS.x}</button>
        </div>
        <div class="balance-hint">
          ${saldoAcerto >= 0 ? `Saldo a seu favor: ${formatBRL(saldoAcerto)}` : `Saldo contra você: ${formatBRL(Math.abs(saldoAcerto))}`}
        </div>
        <div class="type-toggle">
          <button class="type-btn ${f.direction === "recebi" ? "active-receita" : ""}" onclick="ui.loanSettleForm.direction='recebi';render()">Recebi dele</button>
          <button class="type-btn ${f.direction === "paguei" ? "active-despesa" : ""}" onclick="ui.loanSettleForm.direction='paguei';render()">Paguei a ele</button>
        </div>
        <div class="row2">
          <label class="field">Valor (R$)
            <input data-focus="loansettle-amount" value="${esc(f.amount)}" oninput="ui.loanSettleForm.amount=this.value" placeholder="0,00" inputmode="decimal" />
          </label>
          <label class="field">Data
            <input type="date" value="${f.date}" onchange="ui.loanSettleForm.date=this.value" />
          </label>
        </div>
        <label class="field">Observação (opcional)
          <input data-focus="loansettle-desc" value="${esc(f.description)}" oninput="ui.loanSettleForm.description=this.value" placeholder="Ex.: Pix do acerto" />
        </label>
        <span class="hint">Isso cria uma ${f.direction === "recebi" ? "entrada" : "saída"} de verdade no seu fluxo de caixa.</span>
        <button class="submit-btn" onclick="saveLoanSettle()">Registrar acerto</button>
      </div>
    </div>`;
}

function renderLoanEntryFormModal() {
  const loan = state.loans.find((l) => l.id === ui.selectedLoanId);
  if (!loan) return "";
  const f = ui.loanEntryForm;
  const total = f.selectedDates.reduce((s, d) => s + (parseFloat(String(f.amounts[d] || "").replace(",", ".")) || 0), 0);
  const [cy, cm] = f.calendarMonth.split("-");
  const grid = getCalendarGrid(f.calendarMonth);

  return `
    <div class="modal-overlay" onclick="ui.loansStep='detail';render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h2 class="modal-title">${ui.editingLoanEntryId ? "Editar lançamento" : "Registrar valor(es)"}</h2>
          <button class="icon-btn" onclick="ui.loansStep='detail';render()">${ICONS.x}</button>
        </div>

        ${!ui.editingLoanEntryId ? `
          <div>
            <div class="cal-header">
              <button type="button" class="cal-nav-btn" onclick="changeCalendarMonth(-1)">‹</button>
              <span class="cal-month-label">${MONTHS_PT[parseInt(cm, 10) - 1]} ${cy}</span>
              <button type="button" class="cal-nav-btn" onclick="changeCalendarMonth(1)">›</button>
            </div>
            <div class="cal-grid">
              ${WEEKDAYS_PT.map((w) => `<div class="cal-weekday">${w}</div>`).join("")}
              ${grid.map((dateStr) => {
                if (!dateStr) return `<div class="cal-day cal-day-empty"></div>`;
                const day = parseInt(dateStr.slice(8, 10), 10);
                const selected = f.selectedDates.includes(dateStr);
                return `<button type="button" class="cal-day ${selected ? "cal-selected" : ""}" onclick="toggleCalendarDate('${dateStr}')">${day}</button>`;
              }).join("")}
            </div>
          </div>

          ${f.selectedDates.length > 0 ? `
            <div class="cal-selected-list">
              ${f.selectedDates.map((dateStr) => `
                <div class="cal-selected-row">
                  <span class="cal-selected-date">${dateStr.slice(8,10)}/${dateStr.slice(5,7)}</span>
                  <input class="cal-selected-amount" data-focus="loanentry-amount-${dateStr}" value="${esc(f.amounts[dateStr] || "")}" oninput="updateLoanEntryAmount('${dateStr}', this.value);render()" placeholder="Valor R$" inputmode="decimal" />
                  <button type="button" class="icon-btn" style="flex:0 0 auto" onclick="toggleCalendarDate('${dateStr}')" aria-label="Remover data">${ICONS.trash}</button>
                </div>`).join("")}
            </div>
            <span class="hint">Total: ${formatBRL(total)} em ${f.selectedDates.length} data(s)</span>
          ` : `<div class="hint" style="margin-top:10px">Toque nos dias no calendário acima pra selecionar as datas dos valores.</div>`}
        ` : `
          <label class="field">Data
            <input type="date" value="${f.selectedDates[0] || ""}" onchange="ui.loanEntryForm.selectedDates=[this.value]" />
          </label>
          <label class="field">Valor (R$)
            <input data-focus="loanentry-amount-edit" value="${esc(f.amounts[f.selectedDates[0]] || "")}" oninput="ui.loanEntryForm.amounts[ui.loanEntryForm.selectedDates[0]]=this.value" placeholder="0,00" inputmode="decimal" />

function renderCategoryDetailModal(monthTx, monthLabel) {
  const cat = ui.selectedCategory;
  const items = monthTx
    .filter((t) => t.category === cat && t.type === "despesa" && !t.isSettlement)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

    <div class="modal-overlay" onclick="closeCategoryDetail()">
      <div class="modal-large" onclick="event.stopPropagation()">

          <button class="icon-btn" onclick="closeCategoryDetail()">${ICONS.x}</button>
        </div>
        <div class="balance-hint">${items.length} lançamento(s) em ${monthLabel} · total <strong>${formatBRL(total)}</strong></div>

          <h2 class="modal-title">${saldoEsposa >= 0 ? "O que a esposa te deve" : "O que você deve à esposa"}</h2>

        </div>
        <div class="hint">Referente a ${monthLabel}</div>

          ${saldoEsposa >= 0 ? "a favor de você" : "a favor da esposa"}

function renderImportTotalCheck() {
  if (ui.importDetectedTotal == null) return "";
  const included = ui.importRows.filter((r) => r.include);
  const sum = included.reduce((s, r) => s + r.amount, 0);
  const diff = Math.abs(sum - ui.importDetectedTotal);
  const ok = diff < 0.05;
  return `
    <div class="${ok ? "match-box" : "mismatch-box"}">
      ${ok
        ? `${ICONS.check}Bate com o total da fatura: ${formatBRL(ui.importDetectedTotal)}`
        : `⚠️ Total dos itens marcados (${formatBRL(sum)}) não bate com o total da fatura (${formatBRL(ui.importDetectedTotal)}) — diferença de ${formatBRL(diff)}. Confira se algum item ficou de fora ou duplicado.`}
    </div>`;
}
function renderImportModal() {
  if (ui.importStep === "input") {
    return `
      <div class="modal-overlay" onclick="closeImport()">
        <div class="modal-large" onclick="event.stopPropagation()">
          <div class="modal-header"><h2 class="modal-title">Importar fatura</h2><button class="icon-btn" onclick="closeImport()">${ICONS.x}</button></div>
          <label class="field">Mês de referência desta fatura
            <input type="month" value="${ui.importReferenceMonth}" onchange="ui.importReferenceMonth=this.value" />
          </label>
          <label class="field">Categoria padrão dos itens importados
            <select onchange="ui.importCategory=this.value">
              ${categoriesFor("despesa").map((c) => `<option value="${c}" ${ui.importCategory === c ? "selected" : ""}>${c}</option>`).join("")}
            </select>
          </label>

          <div class="row2">
            <label class="field">Seu nome na fatura
              <input data-focus="import-meunome" value="${esc(ui.importMeuNome)}" oninput="ui.importMeuNome=this.value" placeholder="Ex.: LEONARDO C SANTOS" />
            </label>
            <label class="field">Nome da esposa na fatura
              <input data-focus="import-esposanome" value="${esc(ui.importEsposaNome)}" oninput="ui.importEsposaNome=this.value" placeholder="Ex.: SAMILLE FERREIRA" />
            </label>
          </div>
          <span class="hint">Se a fatura tiver seções por titular (ex.: cartão adicional), uso isso pra já pré-marcar "Só eu" / "Só esposa" — mas você pode trocar qualquer item na revisão.</span>

          <label class="field">Enviar arquivo (PDF da fatura, CSV ou TXT)
            <input type="file" accept=".pdf,.csv,.txt" onchange="handleImportFile(event)" />
            ${ui.importLoading ? `<span class="hint">Lendo o PDF, aguarde um instante...</span>` : ""}
          </label>
          <label class="field">Cole aqui o texto copiado da fatura (funciona com faturas detalhadas por titular, ou simples "data, descrição, valor")
            <textarea data-focus="import-rawtext" style="min-height:160px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;resize:vertical" oninput="ui.importRawText=this.value" placeholder="15/03/2026, Supermercado ABC, 234,50
16/03/2026, Posto Shell, 120,00">${esc(ui.importRawText)}</textarea>
          </label>
          ${ui.importError ? `<div class="error-text">${esc(ui.importError)}</div>` : ""}
          <button class="submit-btn" ${(!ui.importRawText.trim() || ui.importLoading) ? "disabled" : ""} style="opacity:${(ui.importRawText.trim() && !ui.importLoading) ? 1 : 0.5}" onclick="analyzeImport()">${ui.importLoading ? "Lendo PDF..." : "Analisar lançamentos"}</button>
        </div>
      </div>`;
  }
  return `
    <div class="modal-overlay" onclick="closeImport()">
      <div class="modal-large" onclick="event.stopPropagation()">
        <div class="modal-header"><h2 class="modal-title">Importar fatura</h2><button class="icon-btn" onclick="closeImport()">${ICONS.x}</button></div>
        <div class="hint">Encontrei ${ui.importRows.length} lançamento(s). Confira a classificação de cada um — pré-marquei por titular quando reconheci as seções da fatura.</div>
        ${renderImportTotalCheck()}
        <div class="import-list">
          ${ui.importRows.map((r) => `
            <div class="import-row">

                <input
                  data-focus="import-desc-${r.id}"
                  class="import-desc-input"
                  value="${esc(r.description)}"

                  ${r.classification === "dividido" ? `<input class="split-input" data-focus="import-split-${r.id}" type="number" min="0" max="100" value="${r.splitEu}" oninput="updateImportRow('${r.id}',{splitEu:this.value})" />` : ""}

          <button class="back-btn" onclick="ui.importStep='input';render()">Voltar</button>

        </div>

}

/* ---------- Handlers auxiliares ---------- */
function openForm() { ui.form = freshForm(); ui.editingId = null; ui.modal = "form"; render(); }
function openEditForm(id) {
  const t = state.transactions.find((tx) => tx.id === id);
  if (!t) return;
  ui.form = {
    date: t.date,
    description: t.description,
    category: t.category,
    type: t.type,
    amount: String(t.amount).replace(".", ","),
    paymentMethod: t.paymentMethod || "dinheiro",
    installments: "1",
    shared: !!t.shared,
    paidBy: t.paidBy || "eu",
    splitEu: t.splitEu != null ? String(t.splitEu) : "50",
  };
  ui.editingId = id;
  ui.modal = "form";
  render();
}
function setFormType(type) {
  ui.form.type = type;
  ui.form.category = type === "receita" ? CATEGORIES_RECEITA[0] : CATEGORIES_DESPESA[0];
  ui.form.paymentMethod = "dinheiro"; ui.form.installments = "1"; ui.form.shared = false;
  render();
}
function openSettle() { ui.settle = freshSettle(); ui.editingSettleId = null; ui.modal = "settle"; render(); }
function openEditSettle(id) {
  const t = state.transactions.find((tx) => tx.id === id);
  if (!t) return;
  ui.settle = {
    date: t.date,
    description: t.description,
    amount: String(t.amount).replace(".", ","),
    direction: t.settlementDirection || "paguei",
  };
  ui.editingSettleId = id;
  ui.modal = "settle";
  render();
}
function openDebtDetail() { ui.modal = "debtDetail"; render(); }
function closeDebtDetail() { ui.modal = null; render(); }
function openCategoryDetail(category) { ui.selectedCategory = category; ui.modal = "categoryDetail"; render(); }
function closeCategoryDetail() { ui.modal = null; ui.selectedCategory = null; render(); }
function openSettings() { ui.settingsForm = null; ui.modal = "settings"; render(); }
function openImport() {
  ui.importStep = "input"; ui.importRawText = ""; ui.importRows = []; ui.importError = ""; ui.importLoading = false;
  ui.importDetectedTotal = null;
  ui.importMeuNome = state.settings.meuNome || "";
  ui.importEsposaNome = state.settings.esposaNome || "";
  ui.modal = "import"; render();
}
function closeImport() { ui.modal = null; render(); }
function updateImportRow(id, patch) {
  ui.importRows = ui.importRows.map((r) => (r.id === id ? { ...r, ...patch } : r));
}
function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  ui.importError = "";
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  if (isPdf) {
    if (!window.pdfjsLib) {
      ui.importError = "A leitura de PDF não carregou (verifique sua internet e tente novamente). Você ainda pode colar o texto copiado do PDF no campo abaixo.";
      render();
      return;
    }
    ui.importLoading = true;
    render();
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const text = await extractTextFromPdf(ev.target.result);
        ui.importRawText = text;
      } catch (err) {
        console.error(err);
        ui.importError = "Não consegui ler esse PDF automaticamente. Tente abrir o arquivo, selecionar/copiar o texto e colar no campo abaixo.";
      }
      ui.importLoading = false;
      render();
    };
    reader.onerror = () => {
      ui.importError = "Não consegui ler esse arquivo.";
      ui.importLoading = false;
      render();
    };
    reader.readAsArrayBuffer(file);
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => { ui.importRawText = ev.target.result || ""; render(); };
  reader.onerror = () => { ui.importError = "Não consegui ler esse arquivo."; render(); };
  reader.readAsText(file, "utf-8");
}

/* ---------- Início ---------- */
/* O primeiro render() é disparado por auth.onAuthStateChanged, lá em cima. */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
  // Quando uma versão nova do app assume, recarrega a página uma vez sozinho —
  // assim ninguém fica preso vendo uma versão antiga em cache.
  let reloadedOnce = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloadedOnce) return;
    reloadedOnce = true;
    window.location.reload();
  });
}
